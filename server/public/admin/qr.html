<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Park — QR Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  .banner{margin:0 20px; padding:12px 14px; border:1.5px solid var(--warn);
    background:color-mix(in srgb,var(--warn) 12%,var(--paper)); font-size:12.5px; line-height:1.55;}
  .banner.hidden{display:none;}
  .banner b{display:block; margin-bottom:3px;}
  .setup{padding:16px 20px; border-bottom:1px solid var(--ink);}
  .setup .row{display:flex; gap:10px; align-items:end; flex-wrap:wrap;}
  .setup .row .field{flex:1; min-width:280px; margin:0;}
  .setup code{font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--paper-2); padding:1px 5px;}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:0;}
  @media(max-width:820px){.cards{grid-template-columns:1fr;}}
  .card{padding:22px; border-right:1px solid var(--ink);}
  .card:last-child{border-right:none;}
  @media(max-width:820px){.card{border-right:none; border-bottom:1px solid var(--ink);}}
  .card h2{font-size:16px; margin-bottom:2px;}
  .card .sub{font-size:11.5px; color:var(--muted); margin-bottom:14px;}
  .qbox{background:#fff; border:1.5px solid var(--ink); padding:14px; width:268px; max-width:100%;}
  .qbox svg{display:block; width:100%; height:auto;}
  .url{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted);
    word-break:break-all; margin:12px 0 14px; max-width:340px; line-height:1.5;}
  .acts{display:flex; gap:8px; flex-wrap:wrap;}
  .pending{color:var(--muted); font-size:13px; padding:30px 0;}

  /* the printable sign */
  #printArea{display:none;}
  @media print{
    body{background:#fff; padding:0;}
    body > .wrap{display:none !important;}
    #printArea{display:block !important;}
    .sign{page-break-after:always; text-align:center; padding:70px 40px; font-family:'Space Grotesk',sans-serif;}
    .sign:last-child{page-break-after:auto;}
    .sign .kind{font-size:70px; font-weight:700; letter-spacing:6px; margin-bottom:6px;}
    .sign .lot{font-size:23px; margin-bottom:4px;}
    .sign .loc{font-size:15px; color:#555; margin-bottom:26px;}
    .sign svg{width:330px; height:330px;}
    .sign .how{font-size:17px; margin-top:22px;}
    .sign .u{font-family:'JetBrains Mono',monospace; font-size:10px; color:#777; margin-top:12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark">SP</div><div><h1 data-brand-title>Smart Park</h1><div class="tag" data-brand-tag></div></div></div>
    <div class="hdr-right"><span class="live-dot" id="liveDot"><i></i> <span id="liveText">Loading</span></span><button class="icon-btn" id="themeBtn">🌙</button></div>
  </header>
  <nav class="navbar">
    <a href="control.html">Control Room</a>
    <a href="layout.html">Layout</a>
    <a href="cameras.html">Cameras</a>
    <a href="qr.html">QR Codes</a>
    <a href="revenue.html">Revenue</a>
    <span class="spacer"></span>
    <a href="index.html" class="switch">switch lot</a>
  </nav>

  <div class="banner hidden" id="banner"></div>

  <div class="setup">
    <h3>Public address of this site</h3>
    <p class="note" style="margin-bottom:10px;">Every QR points here. It must be a public URL — a phone camera cannot open
      <code>localhost</code>. Set it once after deploying; changing it rewrites the codes for every lot.</p>
    <div class="row">
      <div class="field"><label for="baseUrl">Base URL</label><input id="baseUrl" placeholder="https://smart-park-3b9a8.web.app"></div>
      <button class="btn primary" id="saveBase">Save &amp; regenerate</button>
      <button class="btn" id="useThis">Use this page's address</button>
    </div>
  </div>

  <div class="cards" id="cards">
    <div class="card"><div class="pending">Loading…</div></div>
  </div>
</div>

<div id="printArea"></div>

<script type="module">
import { db, functions } from "./js/firebase-config.js";
import { doc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
import { httpsCallable } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-functions.js";
import { mountAdminChrome, toast, explain, live, getLotId, rememberLot, renderNoLots } from "./js/adminui.js";
import { qrSvg, downloadQrPng, lotUrls, guessBaseUrl, cleanBase } from "./js/qr.js";

mountAdminChrome({ title: "QR Codes", tag: "", here: "qr.html" });
const $ = (id) => document.getElementById(id);
const setBaseUrl = httpsCallable(functions, "setBaseUrl");
const refreshLotQr = httpsCallable(functions, "refreshLotQr");

let lotId = getLotId();
let lot = null, baseUrl = "";

(async function boot() {
  if (!lotId) {
    live(false, "Finding a lot…");
    const snap = await getDocs(collection(db, "lots"));
    if (snap.empty) { renderNoLots(document.querySelector(".wrap")); return; }
    lotId = snap.docs[0].id;
  }
  rememberLot(lotId);

  onSnapshot(doc(db, "config", "app"), (s) => {
    baseUrl = s.exists() ? cleanBase(s.data().baseUrl) : "";
    if (!$("baseUrl").matches(":focus")) $("baseUrl").value = baseUrl || "";
    render();
  }, () => { render(); });

  onSnapshot(doc(db, "lots", lotId), (s) => {
    if (!s.exists()) { live(false, "No such lot"); toast(`Lot '${lotId}' doesn't exist.`, true); return; }
    lot = s.data();
    document.querySelector("[data-brand-title]").textContent = lot.name || lotId;
    document.querySelector("[data-brand-tag]").textContent = lot.location || "";
    live(true, "Live"); render();
  }, (e) => { live(false, "Offline"); toast(explain(e), true); });
})();

$("useThis").onclick = () => { $("baseUrl").value = guessBaseUrl(); };
$("saveBase").onclick = async () => {
  const v = cleanBase($("baseUrl").value);
  if (!/^https?:\/\//i.test(v)) return toast("Enter a full URL starting with http:// or https://", true);
  if (/localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]/i.test(v) &&
      !confirm("That's a local address — a phone scanning the QR won't be able to open it. Save anyway?")) return;
  const b = $("saveBase"); b.disabled = true; b.textContent = "Saving…";
  try { const { data } = await setBaseUrl({ baseUrl: v }); toast(`Saved. Regenerated codes for ${data.lotsUpdated} lot${data.lotsUpdated===1?"":"s"}.`); }
  catch (e) { toast(explain(e), true); }
  finally { b.disabled = false; b.textContent = "Save & regenerate"; }
};

function render() {
  if (!lot) return;
  // Prefer what's stored; fall back to composing from the configured base so the
  // page is still useful the moment the base is set, before the write lands.
  const stored = lot.qr || {};
  const composed = baseUrl ? lotUrls(baseUrl, lotId) : { entry: "", exit: "" };
  const entry = stored.entryUrl || composed.entry;
  const exit  = stored.exitUrl  || composed.exit;
  const stale = baseUrl && stored.baseUrl && stored.baseUrl !== baseUrl;

  const b = $("banner");
  if (!baseUrl) {
    b.className = "banner";
    b.innerHTML = "<b>No public address set yet.</b>These codes can't be generated until the site has a real URL. Deploy the site, then paste its address above.";
  } else if (/localhost|127\.0\.0\.1/i.test(baseUrl)) {
    b.className = "banner";
    b.innerHTML = "<b>The base URL is a local address.</b>These codes will only work on this machine. A phone scanning them will fail — deploy the site and update the address.";
  } else if (stale) {
    b.className = "banner";
    b.innerHTML = `<b>These codes point at an old address.</b>Stored: <code>${stored.baseUrl}</code> — current: <code>${baseUrl}</code>. <button class="mini" id="fixQr">Regenerate for this lot</button>`;
  } else {
    b.className = "banner hidden"; b.innerHTML = "";
  }
  const fix = $("fixQr");
  if (fix) fix.onclick = async () => {
    fix.disabled = true;
    try { await refreshLotQr({ lotId }); toast("Regenerated."); }
    catch (e) { toast(explain(e), true); fix.disabled = false; }
  };

  if (!entry || !exit) {
    $("cards").innerHTML = `<div class="card"><div class="pending">Set a public base URL above to generate this lot's codes.</div></div>`;
    $("printArea").innerHTML = "";
    return;
  }

  const card = (kind, label, url, note) => `
    <div class="card">
      <h2>${label}</h2>
      <div class="sub">${note}</div>
      <div class="qbox">${qrSvg(url, { size: 240 })}</div>
      <div class="url">${url}</div>
      <div class="acts">
        <button class="btn" data-dl="${kind}">Download PNG</button>
        <a class="btn" href="${url}" target="_blank" rel="noopener">Open link</a>
        <button class="btn" data-copy="${kind}">Copy link</button>
      </div>
    </div>`;
  $("cards").innerHTML =
    card("entry", "Entry gate", entry, "Print and mount where drivers arrive.") +
    card("exit",  "Exit gate",  exit,  "Print and mount where drivers leave.");

  const urls = { entry, exit };
  $("cards").querySelectorAll("[data-dl]").forEach(btn => btn.onclick = () => {
    const k = btn.dataset.dl;
    downloadQrPng(urls[k], `${lotId}-${k}-qr.png`, { size: 1024 });
    toast(`Downloaded ${lotId}-${k}-qr.png`);
  });
  $("cards").querySelectorAll("[data-copy]").forEach(btn => btn.onclick = async () => {
    try { await navigator.clipboard.writeText(urls[btn.dataset.copy]); toast("Link copied."); }
    catch { toast("Clipboard blocked — select the link text instead.", true); }
  });

  const sign = (kind, url, how) => `
    <div class="sign">
      <div class="kind">${kind}</div>
      <div class="lot">${lot.name || lotId}</div>
      <div class="loc">${lot.location || ""}</div>
      ${qrSvg(url, { size: 330 })}
      <div class="how">${how}</div>
      <div class="u">${url}</div>
    </div>`;
  $("printArea").innerHTML =
    sign("ENTRY", entry, "Scan to see open bays and reserve one") +
    sign("EXIT",  exit,  "Scan to pay and release your bay");
}

// print button lives in the nav area for convenience
const printBtn = document.createElement("button");
printBtn.className = "btn"; printBtn.textContent = "Print gate signs";
printBtn.onclick = () => window.print();
document.querySelector(".navbar .spacer").before(printBtn);
</script>
</body>
</html>
